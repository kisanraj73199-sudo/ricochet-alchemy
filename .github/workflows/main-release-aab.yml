name: Main Production Release (Signed AAB & APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17 (Runs on GitHub Cloud - No Laptop Java Needed!)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Run Tests
        run: |
          npm install
          npm test
          npm run build

      - name: Sync & Patch Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/configure-android.mjs

      - name: Prepare Keystore (Uses Secret OR Auto-Generates on GitHub Cloud)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: ./android
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using saved GitHub Secret Keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > release-key.jks
            STORE_PASS="$KEYSTORE_PASSWORD"
            ALIAS_NAME="$KEY_ALIAS"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "No laptop Java needed! Generating a fresh release-key.jks directly on GitHub Cloud..."
            STORE_PASS="Ricochet1234"
            ALIAS_NAME="ricochetkey"
            KEY_PASS="Ricochet1234"
            keytool -genkeypair -v \
              -keystore release-key.jks \
              -alias "$ALIAS_NAME" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=Ricochet Alchemy, OU=GameDev, O=Studio, L=City, S=State, C=IN"
            base64 -w 0 release-key.jks > generated-keystore-base64.txt
          fi

          ./gradlew bundleRelease assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release-key.jks \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias="$ALIAS_NAME" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Upload Signed Play Store AAB, APK & Generated Key
        uses: actions/upload-artifact@v4
        with:
          name: playstore-signed-release-bundle
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/release-key.jks
            android/generated-keystore-base64.txt